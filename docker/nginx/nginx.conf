# Optional production reverse proxy for the SkyRun API (no static frontend to
# serve anymore — the client is the mobile app). Not started by default; see
# docs/ARCHITECTURE.md for when/how to enable it (e.g. TLS termination for a
# public API endpoint reached by the mobile app).

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types application/json application/javascript text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:5000/uploads/;
        proxy_set_header Host $host;
    }

    location / {
        return 200 'SkyRun API Gateway';
        add_header Content-Type text/plain;
    }
}
